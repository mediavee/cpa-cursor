syntax = "proto3";

package agent.v1;

import "agent/v1/agent_service.proto";
import "aiserver/v1/bidi.proto";

service AgentService {
  rpc Run(stream .agent.v1.AgentClientMessage) returns (stream .agent.v1.AgentServerMessage);
  rpc RunSSE(.aiserver.v1.BidiRequestId) returns (stream .agent.v1.AgentServerMessage);
  rpc RunPoll(.aiserver.v1.BidiPollRequest) returns (stream .aiserver.v1.BidiPollResponse);
  rpc NameAgent(.agent.v1.NameAgentRequest) returns (.agent.v1.NameAgentResponse);
  rpc UpdateConversationMetadata(.agent.v1.UpdateConversationMetadataRequest) returns (.agent.v1.UpdateConversationMetadataResponse);
  rpc CreateTranscriptOverview(.agent.v1.CreateTranscriptOverviewRequest) returns (.agent.v1.CreateTranscriptOverviewResponse);
  rpc GetUsableModels(.agent.v1.GetUsableModelsRequest) returns (.agent.v1.GetUsableModelsResponse);
  rpc GetDefaultModelForCli(.agent.v1.GetDefaultModelForCliRequest) returns (.agent.v1.GetDefaultModelForCliResponse);
  rpc GetAllowedModelIntents(.agent.v1.GetAllowedModelIntentsRequest) returns (.agent.v1.GetAllowedModelIntentsResponse);
  rpc UploadConversationBlobs(.agent.v1.UploadConversationBlobsRequest) returns (.agent.v1.UploadConversationBlobsResponse);
  rpc UploadLocalAgentRunToPromptQuality(.agent.v1.UploadLocalAgentRunToPromptQualityRequest) returns (.agent.v1.UploadLocalAgentRunToPromptQualityResponse);
  rpc GetSignedUrlForAttachedMedia(.agent.v1.GetSignedUrlForAttachedMediaRequest) returns (.agent.v1.GetSignedUrlForAttachedMediaResponse);
  rpc NotifyConversationClone(.agent.v1.NotifyConversationCloneRequest) returns (.agent.v1.NotifyConversationCloneResponse);
  rpc GetNewChatNudgeLegacyModelPicker(.agent.v1.GetNewChatNudgeLegacyModelPickerRequest) returns (.agent.v1.GetNewChatNudgeLegacyModelPickerResponse);
  rpc GetNewChatNudgeParameterizedModelPicker(.agent.v1.GetNewChatNudgeParameterizedModelPickerRequest) returns (.agent.v1.GetNewChatNudgeParameterizedModelPickerResponse);
  rpc GetPromptContextUsage(.agent.v1.GetPromptContextUsageRequest) returns (.agent.v1.GetPromptContextUsageResponse);
  rpc ListLocalSubscriptionTools(.agent.v1.ListLocalSubscriptionToolsRequest) returns (.agent.v1.ListLocalSubscriptionToolsResponse);
  rpc CallLocalSubscriptionTool(.agent.v1.CallLocalSubscriptionToolRequest) returns (.agent.v1.CallLocalSubscriptionToolResponse);
  rpc StreamLocalAgentMailbox(.agent.v1.StreamLocalAgentMailboxRequest) returns (stream .agent.v1.StreamLocalAgentMailboxResponse);
}
