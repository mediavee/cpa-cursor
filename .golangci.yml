version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - misspell
    - nilerr
    - noctx
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*compress/gzip.Reader).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    paths:
      - internal/gen
    rules:
      # x/net v0.60 (required by the CPA SDK) deprecates http2.Transport in favour of http.Transport with
      # HTTP2 settings; the Run stream still needs the former until the client is migrated.
      - text: "golang.org/x/net/http2"
        linters: [staticcheck]

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - internal/gen
